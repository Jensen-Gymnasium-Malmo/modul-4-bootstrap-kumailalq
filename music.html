<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header></header>

<main class="container my-5">

  <h1 class="text-center mb-5">My Favorite Music</h1>

  <div class="row g-4">

    <!-- Låt 1 -->
    <div class="col-12 col-md-4">
      <div class="card h-100 shadow">

        <img src="Papparazzi.jpg"
             class="card-img-top img-fluid"
             alt="Papparatzi">

        <div class="card-body text-center">

          <h5>Papparazzi</h5>

          <p><strong>Artist:</strong> Asme</p>
          <p><strong>Genre:</strong> Hiphop / Rap</p>

        </div>

      </div>
    </div>

    <!-- Låt 2 -->
    <div class="col-12 col-md-4">
      <div class="card h-100 shadow">

        <img src="Zuttlukten.jpg"
             class="card-img-top img-fluid"
             alt="Zuttlukten">

        <div class="card-body text-center">

          <h5>Zuttlukten</h5>

          <p><strong>Artister:</strong> Dizzy & Manny Flaco</p>
          <p><strong>Genre:</strong> Hiphop / Rap</p>

        </div>

      </div>
    </div>

    <!-- Låt 3 -->
    <div class="col-12 col-md-4">
      <div class="card h-100 shadow">

        <img src="Hipp.jpg"
             class="card-img-top img-fluid"
             alt="Yasin">

        <div class="card-body text-center">

          <h5>Hiphop and RnB</h5>

          <p><strong>Artist:</strong> Yasin</p>
          <p><strong>Genre:</strong> Hiphop / RnB</p>

        </div>

      </div>
    </div>

  </div>

</main>

<footer></footer>

<script src="init.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
